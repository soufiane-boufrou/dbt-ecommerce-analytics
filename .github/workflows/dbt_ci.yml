name: dbt CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      DUCKDB_PATH: ci.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Load raw data
        run: python scripts/load_raw_data.py --customers 2000

      - name: Install packages
        run: dbt deps

      - name: Build and test all models
        run: dbt build --fail-fast
